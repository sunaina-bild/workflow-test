name: Deploy CAD

on:
  workflow_call:
    inputs:
      target-env:
        type: string
        required: true
      instance-refresh:
        type: boolean
        required: false
        default: false
        description: Start an ASG instance refresh after the zip is uploaded to S3
    secrets:
      AWS_ACCESS_KEY:
        required: true
      AWS_SECRET_KEY:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target-env }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Create AWS credentials file
        env:
          AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_KEY: ${{ secrets.AWS_SECRET_KEY }}
        run: |
          mkdir -p ~/.aws
          echo "[default]" > ~/.aws/credentials
          echo "aws_access_key_id = $AWS_ACCESS_KEY" >> ~/.aws/credentials
          echo "aws_secret_access_key = $AWS_SECRET_KEY" >> ~/.aws/credentials

      - name: Generate Zip
        run: |
          echo "test command"

      
      - name: Start instance refresh
        id: instance_refresh
        if: ${{ inputs.instance-refresh }}
        env:
          AWS_REGION: ${{ vars.REGION }}
          TARGET_ENV: ${{ inputs.target-env }}
          TAG_KEY: 'bild:service'
          TAG_VALUE: 'cad'
          MIN_HEALTHY_PERCENTAGE: '75'
          MAX_HEALTHY_PERCENTAGE: '150'
        run: |
          set -euo pipefail

          if [ -z "${AWS_REGION:-}" ]; then
            echo "::error::AWS_REGION is empty. Set the 'REGION' variable for the '${TARGET_ENV}' environment before enabling instance-refresh."
            exit 1
          fi

          echo "Discovering CAD Auto Scaling Groups tagged ${TAG_KEY}=${TAG_VALUE} in ${AWS_REGION}..."
          ASG_NAMES=$(aws autoscaling describe-auto-scaling-groups \
            --filters "Name=tag:${TAG_KEY},Values=${TAG_VALUE}" \
            --query 'AutoScalingGroups[].AutoScalingGroupName' \
            --output text)

          if [ -z "$ASG_NAMES" ]; then
            echo "::error::No Auto Scaling Group found with tag ${TAG_KEY}=${TAG_VALUE} in region ${AWS_REGION}. Is the CAD stack deployed and tagged?"
            exit 1
          fi
          echo "Found ASG(s) to refresh: $ASG_NAMES"

          # Start an instance refresh for each discovered ASG and record the
          # "ASG_NAME REFRESH_ID" pairs. start-instance-refresh is asynchronous,
          # so completion is tracked separately in the "Wait" step below, which
          # consumes these pairs from this step's output.
          REFRESHES=""
          for asg in $ASG_NAMES; do
            echo "[$asg] Starting instance refresh (MinHealthy=${MIN_HEALTHY_PERCENTAGE}%, MaxHealthy=${MAX_HEALTHY_PERCENTAGE}%, InService + warm pool)"
            refresh_id=$(aws autoscaling start-instance-refresh \
              --auto-scaling-group-name "$asg" \
              --preferences "{\"MinHealthyPercentage\": ${MIN_HEALTHY_PERCENTAGE}, \"MaxHealthyPercentage\": ${MAX_HEALTHY_PERCENTAGE}, \"SkipMatching\": false}" \
              --query 'InstanceRefreshId' --output text) || {
                echo "::error::[$asg] start-instance-refresh call failed"
                exit 1
              }
            if [ -z "$refresh_id" ] || [ "$refresh_id" = "None" ]; then
              echo "::error::[$asg] start-instance-refresh returned no InstanceRefreshId"
              exit 1
            fi
            echo "[$asg] Instance refresh started: $refresh_id"
            REFRESHES="${REFRESHES}${asg} ${refresh_id}"$'\n'
          done

          # Expose the "ASG_NAME REFRESH_ID" lines as a step output for the wait step.
          {
            echo "refreshes<<REFRESHES_EOF"
            printf '%s' "$REFRESHES"
            echo "REFRESHES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Wait for instance refresh
        if: ${{ inputs.instance-refresh }}
        env:
          AWS_REGION: ${{ vars.REGION }}
          REFRESHES: ${{ steps.instance_refresh.outputs.refreshes }}
          MAX_WAIT_SECONDS: '7200'
          POLL_INTERVAL_SECONDS: '30'
        run: |
          set -euo pipefail

          if [ -z "${REFRESHES//[[:space:]]/}" ]; then
            echo "::error::No instance refresh ids were produced by the start step."
            exit 1
          fi

          # Poll one refresh until it reaches a terminal state.
          wait_for_refresh() {
            asg="$1"
            refresh_id="$2"
            echo "[$asg] Waiting for instance refresh $refresh_id to complete..."
            elapsed=0
            while true; do
              sleep "$POLL_INTERVAL_SECONDS"
              elapsed=$((elapsed + POLL_INTERVAL_SECONDS))

              refresh_json=$(aws autoscaling describe-instance-refreshes \
                --auto-scaling-group-name "$asg" \
                --instance-refresh-ids "$refresh_id" \
                --query 'InstanceRefreshes[0]' --output json) || {
                  echo "::error::[$asg] describe-instance-refreshes call failed"
                  return 1
                }
              status=$(echo "$refresh_json" | jq -r '.Status // empty')
              if [ -z "$status" ]; then
                echo "::error::[$asg] could not read instance refresh status (empty/null response)"
                return 1
              fi
              pct=$(echo "$refresh_json" | jq -r '.PercentageComplete // 0')
              echo "[$asg] status: $status (${pct}% complete, ${elapsed}s elapsed)"

              case "$status" in
                Successful)
                  echo "[$asg] Instance refresh completed successfully."
                  return 0
                  ;;
                Failed|Cancelled|RollbackFailed|RollbackSuccessful)
                  reason=$(echo "$refresh_json" | jq -r '.StatusReason // "No reason provided"')
                  echo "::error::[$asg] Instance refresh $refresh_id ended with status '$status': $reason"
                  return 1
                  ;;
              esac

              if [ "$elapsed" -ge "$MAX_WAIT_SECONDS" ]; then
                echo "::error::[$asg] Instance refresh $refresh_id did not finish within ${MAX_WAIT_SECONDS}s (last status: $status)."
                return 1
              fi
            done
          }

          rc=0
          while read -r asg refresh_id; do
            if [ -z "$asg" ]; then
              continue
            fi
            wait_for_refresh "$asg" "$refresh_id" || rc=1
          done <<< "$REFRESHES"
          exit $rc



