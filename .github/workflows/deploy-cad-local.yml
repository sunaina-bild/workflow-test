name: Deploy CAD Local

on:
  workflow_dispatch:
    inputs:
      instance-refresh:
        description: Start an ASG instance refresh after uploading to S3 (refreshes ASGs tagged bild:service=cad)
        type: boolean
        required: false
        default: false

jobs:
  deploy:
    uses: ./.github/workflows/deploy-cad.yml
    secrets: inherit
    with:
      target-env: dev
      instance-refresh: ${{ inputs.instance-refresh }}
